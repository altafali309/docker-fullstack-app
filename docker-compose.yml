version: '3'

services:

  backend:
    build: ./backend
    ports:
      - "3000:3000"

  frontend:
    build: .
    ports:
      - "5000:80"
    depends_on:
      - backend


  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ali3012
      MYSQL_DATABASE: dockerdb
      MYSQL_USER: docker_app
      MYSQL_PASSWORD: ali301225
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d

volumes:
  db_data:
