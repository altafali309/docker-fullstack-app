<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker DevOps App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            background: white;
            margin: 10px auto;
            padding: 10px;
            width: 200px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>🚀 Users from Database</h1>

    <button onclick="loadUsers()">Load Users</button>

    <ul id="userList"></ul>

    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/');
                const data = await res.json();

                const list = document.getElementById("userList");
                list.innerHTML = "";

                data.forEach(user => {
                    const li = document.createElement("li");
                    li.textContent = user.name;
                    list.appendChild(li);
                });

            } catch (err) {
                console.error("Error:", err);
            }
        }
    </script>

</body>
</html>
